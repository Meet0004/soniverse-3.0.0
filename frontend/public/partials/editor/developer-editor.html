<div id="container-dev">
    <div id="left-side-dev">
        <div id="top-section-dev">
            <div class="panel-dev" id="directory-panel-dev">
                <div class="header-dev">Directory</div>
                
                <div class="container-devMode">
                    <div class="sidebar-devMode">
                        <div class="drop-area-devMode" id="drop-area-devMode">
                            <p>Drag & drop files or folders here<br>or<br>Use the buttons to select files/folders</p>
                        </div>
                        <div class="action-buttons-devMode">
                            <button class="create-file-btn-devMode" id="create-file-btn-devMode"> <img src="/icons/newfile.svg" id="55Logo"> </button>
                            <button class="select-folder-btn-devMode" id="select-folder-btn-devMode"> <img src="/icons/selectfolder.svg"  id="56Logo"> </button>
                            <button class="select-files-btn-devMode" id="select-files-btn-devMode"> <img src="/icons/selectfiles.svg"  id="57Logo"> </button><br>
                            <div class="file-info-devMode" id="file-info-devMode"></div> <br>
                            <div class="button-group-devMode">
                                <button class="clear-btn-devMode" id="clear-btn-devMode">Clear</button>
                                <button class="save-btn-devMode" id="save-btn-new-devMode" disabled> Save</button>
                            </div>
                        </div>
                        <div class="files-list-devMode" id="files-list-devMode">
                            <p id="no-files-devMode"></p>
                        </div>
                    </div>
                    <div class="editor-devMode"> </div>
                </div>
                
                <div id="new-file-modal-devMode" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
                    <div style="background-color: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
                        <h3>Create New File</h3>
                        <div style="margin-bottom: 15px;">
                            <label for="new-file-name-devMode">File Name:</label>
                            <input type="text" id="new-file-name-devMode" style="width: 100%; padding: 3px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label for="folder-select-devMode">Location:</label>
                            <select id="folder-select-devMode" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="root">Root Directory</option>
                                <!-- Folder options will be added dynamically -->
                            </select>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 10px;">
                            <button id="cancel-create-btn-devMode" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #e74c3c; color: white; cursor: pointer;">Cancel</button>
                            <button id="confirm-create-btn-devMode" style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #2ecc71; color: white; cursor: pointer;">Create</button>
                        </div>
                    </div>
                </div>
                
                
            </div>
            <div class="vertical-divider-dev" id="divider1-dev"></div>
          
            <div class="panel-dev" id="html-panel-dev">
                <div class="header-dev">HTML</div>
                <div class="content-dev">
                    <div class="editor-container2">
                        <textarea id="html-editor"></textarea> 
                        
                      </div>
                </div>
                
            </div>
          
            <div class="vertical-divider-dev" id="divider2-dev"></div>
          
            <div class="panel-dev" id="css-panel-dev">
                <div class="header-dev">CSS</div>
                <div class="content-dev">
                    <div class="editor-container2">
                        <textarea id="css-editor"></textarea> 
                        
                      </div>
                </div>
            </div>
        </div>
        <div class="horizontal-divider-dev" id="divider3-dev"></div>
        <div class="panel-dev" id="js-panel-dev">
            <div class="header-dev">JS</div>
            <div class="content-dev">
                <div class="editor-container2">
                    <textarea id="js-editor"></textarea> 
                    
                  </div>
            </div>
        </div>
    </div>
    <div class="vertical-divider-dev" id="divider-main-dev"></div>
    <div id="right-side-dev">
        <div class="panel-dev" id="preview-panel-dev">
            <div class="header-dev">Preview</div>
            <div class="content-dev">
                <iframe id="live-preview"></iframe>
            </div>
        </div>
    </div>
</div>
