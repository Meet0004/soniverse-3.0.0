<div id="main-content">
    <div id="top-section">
        <div class="panel" id="directory-panel">
            <div class="header" id="diretoryHeaderprogMode">
                <p>Explorer</p>
            </div>
            <div class="container">
                <div class="sidebar">
                    <div class="drop-area" id="drop-area">
                        <p>Drag & drop files or folders here<br>or<br>Use the buttons to select files/folders</p>
                    </div>
                    <div class="action-buttons">
                        <button class="create-file-btn" id="create-file-btn"> <img id="18Logo"
                                src="/icons/newfileW.svg"> </button>
                        <button class="select-folder-btn" id="select-folder-btn"> <img id="19Logo"
                                src="/icons/selectfolderW.svg"> </button>
                        <button class="select-files-btn" id="select-files-btn"> <img id="20Logo"
                                src="/icons/selectfilesW.svg"> </button><br>
                        <div class="file-info" id="file-info"></div> <br>
                        <div class="button-group">
                            <button class="clear-btn" id="clear-btn">Clear</button>
                            <button class="save-btn" id="save-btn-new" disabled> Save</button>
                        </div>
                    </div>
                    <div class="files-list" id="files-list">
                        <p id="no-files"></p>
                    </div>
                </div>
                <div class="editor"> </div>
            </div>
            <div id="new-file-modal"
                style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
                <div
                    style="background-color: #0c1021; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
                    <h3>Create New File</h3>
                    <div style="margin-bottom: 15px;">
                        <label for="new-file-name">File Name:</label>
                        <input type="text" id="new-file-name"
                            style="width: 100%; padding: 3px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label for="folder-select">Location:</label>
                        <select id="folder-select"
                            style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px;">
                            <option value="root">Root Directory</option>
                            <!-- Folder options will be added dynamically -->
                        </select>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button id="cancel-create-btn"
                            style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #e74c3c; color: white; cursor: pointer;">Cancel</button>
                        <button id="confirm-create-btn"
                            style="padding: 8px 16px; border: none; border-radius: 4px; background-color: #2ecc71; color: white; cursor: pointer;">Create</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="vertical-divider" id="divider1"></div>

        <div class="panel" id="code-panel">
            <div class="header">
                <div class="alldetailsmaybe">
                    <div class="dpaurname">
                        <img src="" alt="Developer" id="displayPicture">
                        <input type="text" id="myName" class="enterusername" readonly>
                    </div>
                    <span class="status disconnected" id="connection-status">Disconnected</span>
                    <span id="codeDetails">Session code: <span class="session-code" id="session-code"></span> </span>

                    <span class="users-count" id="users-count"> Users: 1</span>

                    <div>
                        <span class="copied" id="copied-message">Copied!</span>
                        <button id="copyShareLinkBtn" class="action-button copySL-button">
                            <span class="button-label">Copy Share Link</span>
                            <span id="copyShareLinkShortcut"></span>
                        </button>
                    </div>


                    <div class="dropdown-container">
                        <div class="dropdown-toggle" id="language-dropdown-toggle">
                            <div class="selected-language">
                                <img class="programming-lang-btn" src="/icons/1.png" id="selected-lang-img">
                                <span id="selected-lang-text">Java</span>
                            </div>
                            <span class="dropdown-arrow">▼</span>
                        </div>

                        <div class="dropdown-menu" id="language-dropdown-menu">

                            <button id="c" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/2.png"> C
                            </button>
                            <button id="cpp" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/9.png"> C++
                            </button>
                            <button id="java" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/1.png"> Java
                            </button>
                            <!-- <button id="dart" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/8.png"> Dart
                        </button> -->
                            <button id="python" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/4.png"> Python
                            </button>
                            <button id="javascript" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/16.png"> JavaScript
                            </button>
                            <!-- <button id="typescript" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/5.png"> TypeScript
                        </button> -->
                            <button id="go" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/6.png"> Go
                            </button>
                            <button id="rust" class="language-btn">
                                <img class="programming-lang-btn" src="/icons/10.png"> Rust
                            </button>
                            <!-- <button id="r" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/11.png"> R
                        </button>
                        <button id="php" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/15.png"> PHP
                        </button>
                        <button id="ruby" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/20.png"> Ruby
                        </button>
                        <button id="swift" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/13.png"> Swift
                        </button>
                        <button id="kotlin" class="language-btn">
                            <img class="programming-lang-btn" src="/icons/12.png"> Kotlin
                        </button> -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="editor-container">
                <div class="code-editor">
                    <textarea id="editor"></textarea>
                </div>
            </div>
        </div>

    </div>
    <!-- bottom section -->
    <div class="horizontal-divider" id="horizontal-divider" style="display: block;"></div>
    <div id="bottom-section" style="display: flex;">
        <div class="panel" id="output-panel" style="flex: 1; min-width: 0px; display: block;">
            <div class="header">Output</div>
            <div class="content" id="Output"></div>
            <div id="compilekaDiv">
                <span id="compile-status">compilation status</span> <br><span id="compilation-time">compilation
                    time</span><br>
                <span id="error-output">no - error </span><br>
            </div>

            <div id="outputkadiv">
                <pre id="output">  </pre>
                <p id="exec-time">Execution Time: <span id="execution-time">0 ms</span></p>
            </div>
        </div>

        <div class="vertical-divider" id="divider4"></div>

        <div class="panel" id="input-panel" style="flex: 1; min-width: 0px; display: block;">
            <div class="header">Input</div>
            <div class="content"></div>
            <textarea id="input" class="input-code" placeholder="Enter input..."></textarea>
        </div>
    </div>
</div>
