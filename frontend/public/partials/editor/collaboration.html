<div id="chitchat-container">
    <!-- Row 1: heading (left) + voice call (right) -->
    <div class="chitchat-top">
    <div class="chitchatHeading">
        <h1>Chit Chat</h1>
        <p>Talk, share files and send voice notes with everyone in this session.</p>
    </div>

    <!-- Voice call -->
    <div class="container-chitchatV">
        <div id="status-chitchatV">Not connected</div>

        <div class="allthree">
            <div class="call-controls-chitchatV">
                <button id="startCall-chitchatV" class="action-button startcall-button">Start Call</button>
                <button id="endCall-chitchatV" class="action-button endcall-button" disabled>End Call</button>
            </div>
            <div id="callrec"></div>
        </div>

        <div id="incomingCall-chitchatV" class="popup-chitchatV">
            <h2>Incoming Call</h2>
            <button id="acceptCall-chitchatV" class="action-button acceptcall-button">Accept Call</button>
            <button id="rejectCall-chitchatV" class="action-button rejectcall-button">Reject Call</button>
        </div>
    </div>
    </div><!-- /chitchat-top -->

    <!-- Row 2: chat -->
    <div id="container-chitchat">
        <!-- Login Screen -->
        <div class="login-container-chitchat" id="login-screen-chitchat">
            <h2>Join Chat</h2>
            <input type="text" id="username-input-chitchat" class="login-input-chitchat" placeholder="Enter your username" autocomplete="off">
            <button id="join-button-chitchat" class="login-button-chitchat">Join</button>
        </div>

        <!-- Chat Interface -->
        <div class="chat-container-chitchat" id="chat-screen-chitchat" style="display: none;">
            <div class="users-panel-chitchat">
                <div class="users-title-chitchat">Online Users</div>
                <ul class="users-list-chitchat" id="users-list-chitchat"></ul>
            </div>

            <div class="chat-panel-chitchat">
                <div class="messages-container-chitchat" id="messages-container-chitchat"></div>
                <div class="typing-indicator-chitchat" id="typing-indicator-chitchat"></div>
                <div id="file-preview-container-chitchat"></div>
                <div id="audio-preview-container-chitchat"></div>

                <div class="input-container-chitchat">
                    <input type="text" id="message-input-chitchat" placeholder="Type a message..." autocomplete="off">

                    <div class="file-upload-container-chitchat">
                        <label for="file-upload-chitchat" class="file-upload-label-chitchat" title="Attach file">📎</label>
                        <input type="file" id="file-upload-chitchat" accept="image/*,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    </div>

                    <div class="audio-controls-chitchat">
                        <button id="record-button-chitchat" class="record-button-chitchat" title="Record audio">🎤</button>
                        <span id="audio-time-chitchat" class="audio-time-chitchat"></span>
                    </div>

                    <button id="send-button-chitchat">Send</button>
                </div>

                <div class="file-upload-progress-chitchat">
                    <div class="file-upload-progress-bar-chitchat" id="file-upload-progress-bar-chitchat"></div>
                </div>
            </div>
        </div>
    </div>
</div>
