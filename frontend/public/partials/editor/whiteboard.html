    <div id="realWhiteboard">
            <div class="controls-whiteboard">
                <!-- Drawing Tools Section -->
                <div class="tool-section">
                    <h3>Drawing Tools</h3>
                    <div class="tool-group">
                        <label for="colorPicker-whiteboard">Color:</label>
                        <input type="color" id="colorPicker-whiteboard" class="color-picker" value="#000000">
                    </div>
                    
                    <div class="tool-group">
                        <label for="brushSize-whiteboard">Brush Size:</label> <br>
                        <input type="range" id="brushSize-whiteboard" min="1" max="100" value="2" class="slider">
                        <span id="brushSizeValue-whiteboard"></span>
                    </div>
                
                    <div class="tool-group">
                        <div id="basicColors-whiteboard" class="color-palette">
                            <button id="basic-black" class="color-btn-whiteboard" data-color="#000000" title="Black"> <img src="/icons/brush.png" alt="Black Brush"> </button>
                            <button id="basic-red"   class="color-btn-whiteboard" data-color="#FF0000" title="Red"> <img src="/icons/brush.png" alt="Black Brush">   </button>
                            <button id="basic-blue" class="color-btn-whiteboard" data-color="#0000FF" title="Blue"> <img src="/icons/brush.png" alt="Black Brush">  </button><br>
                            <button id="basic-green" class="color-btn-whiteboard" data-color="#008000" title="Green"><img src="/icons/brush.png" alt="Black Brush">  </button>
                            <button id="basic-yellow" class="color-btn-whiteboard" data-color="#FFFF00" title="Yellow"><img src="/icons/brush.png" alt="Black Brush"> </button>
                        </div>
                    </div>
                </div>
            
                <!-- Eraser Section -->
                <div class="tool-section">
                    <div class="tool-group">
                        <button id="eraser-whiteboard" class="eraser-btn" title="Eraser">
                            <img src="/icons/erasor.png" id="erasorPNG-whiteboard" alt="Eraser">
                        </button>
                        <label for="eraserSize-whiteboard">Size:</label>
                        <input type="range" id="eraserSize-whiteboard" min="5" max="100" value="20" class="slider">
                        <span id="eraserSizeValue-whiteboard"></span>
                    </div>
                </div>
            
                <!-- Text Tools Section -->
                <div class="tool-section">
                    <h3>Text Tools</h3>
                    <div class="tool-group">
                        <input type="text" id="textInput-whiteboard" placeholder="Enter your text" class="text-input">
                    </div>
                    <div class="tool-group">
                        <label for="textSize-whiteboard">Size:</label>
                        <input type="number" id="textSize-whiteboard" min="10" max="100" value="20" class="number-input">
                        <label for="textColorPicker-whiteboard">Color:</label>
                        <input type="color" id="textColorPicker-whiteboard" value="#000000" class="color-picker">
                    </div>
                    <button id="addText-whiteboard" class="action-btn">Add Text</button>
                </div>
            
                <!-- Canvas Actions -->
                <div class="tool-section">
                    <hr>
                    <div class="action-group">
                        <button id="clearCanvas-whiteboard" class="action-btn warning">Clear Canvas</button>
                        <button id="saveCanvas-whiteboard" class="action-btn success">Download</button>
                    </div>
                </div>
            </div>
        
            <div class="bajuWala">
                <canvas id="whiteboard-whiteboard"></canvas>
            </div>
    </div>
