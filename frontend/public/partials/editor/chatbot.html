<section id="AI-chatbot" aria-label="AI assistant">
    <div class="chat-container-AI">
        <header class="chat-header-AI">
            <div class="chat-brand-AI">
                <span class="chat-avatar-AI" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 2.75 14.15 9.1 20.5 11.25l-6.35 2.15L12 19.75l-2.15-6.35L3.5 11.25 9.85 9.1 12 2.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="m19 15 .95 2.8 2.8.95-2.8.95L19 22.5l-.95-2.8-2.8-.95 2.8-.95L19 15Z" fill="currentColor"/>
                    </svg>
                </span>
                <div>
                    <span class="chat-eyebrow-AI">SONIVERSE AI</span>
                    <h2 class="chat-title-AI">AI Assistant</h2>
                </div>
            </div>
            <div class="chat-header-actions-AI">
                <span id="ai-config-status-AI" class="ai-config-status-AI" role="status">Checking setup</span>
                <button id="new-chat-button-AI" class="new-chat-button-AI" type="button" title="Start a new chat">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    New chat
                </button>
            </div>
        </header>

        <div id="api-key-container-AI" class="chat-toolbar-AI">
            <div class="chat-context-AI">
                <span></span>
            </div>
            <label class="model-picker-AI">
                <span>Model</span>
                <select id="model-select-AI" aria-label="AI model">
                    <option value="openai/gpt-oss-120b">GPT OSS 120B · Reasoning</option>
                </select>
            </label>
        </div>

        <div class="chat-messages-AI" id="chat-messages-AI" aria-live="polite" aria-label="Conversation">
            <div class="chat-welcome-AI">
                <span class="chat-avatar-AI" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 2.75 14.15 9.1 20.5 11.25l-6.35 2.15L12 19.75l-2.15-6.35L3.5 11.25 9.85 9.1 12 2.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="m19 15 .95 2.8 2.8.95-2.8.95L19 22.5l-.95-2.8-2.8-.95 2.8-.95L19 15Z" fill="currentColor"/>
                    </svg>
                </span>
                <h3>What are we learning?</h3>
                <p>Ask a question, explore an idea, or get help with your code.</p>
            </div>
        </div>

        <div class="chat-composer-wrap-AI">
            <div class="chat-input-AI">
                <textarea id="message-input-AI" rows="1" placeholder="Message your assistant…" autocomplete="off" aria-label="Message your assistant"></textarea>
                <button id="send-button-AI" type="button" aria-label="Send message">
                    <span>Send</span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <p class="chat-disclaimer-AI">AI responses can be inaccurate. Review generated code before using it.</p>
        </div>
    </div>
</section>
