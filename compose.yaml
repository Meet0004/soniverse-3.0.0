services:
  soniverse:
    image: soniverse:2.1.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - soniverse-uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  soniverse-uploads:
