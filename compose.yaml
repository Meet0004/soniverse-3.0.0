services:
  collabverse:
    image: collabverse:1.1.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - collabverse-uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  collabverse-uploads:
